pre-commit:
  jobs:
    - name: react-doctor
      run: bun run doctor --staged --no-score --blocking error

    - run: bun x ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
